<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="나의 링크를 모아둔 MyLink 페이지">
  <title>MyLink</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #f5f7fb; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px 16px; color: #20263b;
      font-family: Arial, 'Malgun Gothic', system-ui, sans-serif;
    }
    main { width: 100%; max-width: 440px; }
    .profile { text-align: center; margin-bottom: 29px; }
    .avatar {
      width: 86px; height: 86px; margin: 0 auto 19px;
      display: grid; place-items: center; border-radius: 28px;
      color: white; background: linear-gradient(135deg, #6375f3, #9d73eb);
      font-size: 27px; font-weight: bold; box-shadow: 0 10px 22px #707fed30;
    }
    h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: -1px; }
    .intro { color: #6b7280; font-size: 14px; line-height: 1.8; margin: 0; }
    .links { display: grid; gap: 13px; }
    .links a {
      display: flex; align-items: center; gap: 14px; text-decoration: none;
      color: #283249; background: white; padding: 17px 19px;
      border: 1px solid #e6eaf3; border-radius: 17px;
      box-shadow: 0 5px 16px #222a4310;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .links a:hover, .links a:focus-visible {
      transform: translateY(-2px); box-shadow: 0 9px 22px #222a431c;
    }
    .icon {
      width: 42px; height: 42px; flex: none; display: grid; place-items: center;
      border-radius: 13px; background: #f0f2fa; font-weight: bold; font-size: 18px;
    }
    .name { display: block; font-weight: bold; font-size: 16px; }
    .detail { display: block; color: #7a8395; font-size: 12px; margin-top: 5px; }
    .arrow { margin-left: auto; color: #a2a9b8; font-size: 20px; }
    footer { margin-top: 28px; text-align: center; color: #a0a8b5; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) {
      .links a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="profile">
      <div class="avatar" aria-hidden="true">MY</div>
      <h1>MyLink</h1>
      <p class="intro">안녕하세요!<br>자주 사용하는 사이트를 한곳에 모았습니다.</p>
    </header>
    <nav class="links" aria-label="바로가기 링크">
      <a href="https://github.com/xkzldhs0001-commits" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">G</span>
        <span><span class="name">GitHub</span><span class="detail">내 GitHub 프로필</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://www.naver.com/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">N</span>
        <span><span class="name">NAVER</span><span class="detail">네이버 바로가기</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">▶</span>
        <span><span class="name">YouTube</span><span class="detail">유튜브 바로가기</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">⌕</span>
        <span><span class="name">Google</span><span class="detail">구글 검색 바로가기</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <footer>MyLink · 2026</footer>
  </main>
</body>
</html>
